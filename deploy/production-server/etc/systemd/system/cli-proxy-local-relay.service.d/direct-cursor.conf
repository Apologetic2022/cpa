[Service]
# The oxylabs upstream answers 407 for every credential we hold; egress goes
# direct from this (DynamicUser) process instead. The gateway uid stays fully
# kernel-blocked by relay-egress-guard, and the allow-list keeps Anthropic
# unreachable from the gateway.
ExecStart=
ExecStart=/usr/bin/python3 /opt/cli-proxy/bin/cursor_connect_proxy.py --listen 127.0.0.1 --port 18006

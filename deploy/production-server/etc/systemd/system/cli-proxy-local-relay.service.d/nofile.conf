[Service]
# The gateway holds one CONNECT tunnel per in-flight Cursor run plus the
# catalog/token calls, so the default 1024 fds ran out and every new tunnel
# failed with EMFILE. A failed AvailableModels fetch downgrades the gateway to
# its 3-model builtin list, which is how grok-4.6 became an unknown provider.
LimitNOFILE=65536

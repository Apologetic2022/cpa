[Service]
# Generated image URLs must be fetchable by a client that validates TLS: the
# bare-IP certificate is self-signed, so a Node-side fetch of an image fails
# with DEPTH_ZERO_SELF_SIGNED_CERT. 0fcc5ed6.sslip.io is this host's address
# in hex, resolves here through sslip.io's wildcard DNS, and carries its own
# Let's Encrypt certificate (nginx vhost cli-proxy-tls-hostname), so it is
# trusted anywhere while keeping the reply from reading as an address.
Environment="CPA_PUBLIC_BASE_URL=https://0fcc5ed6.sslip.io"
# The service user has no home directory and PrivateTmp wipes /tmp on
# restart, so hosted images are cached inside the unit's own ReadWritePaths.
Environment="CPA_IMAGE_CACHE_DIR=/opt/cli-proxy/image-cache"
# An absolute link is the only reference chat clients reliably render. A
# host-less path was tried and broke: the renderer resolves it against the
# app's own origin rather than the API base, so the image 404s and the reader
# gets a broken-image icon. The link therefore has to name a host, and the
# host is written in hex so the reply does not read as an address.
Environment="CPA_IMAGE_DELIVERY=link"

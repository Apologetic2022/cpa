[Service]
# Generated image URLs must be fetchable by a client that validates TLS: the
# bare-IP certificate is self-signed, so a Node-side fetch of an image fails
# with DEPTH_ZERO_SELF_SIGNED_CERT. 15-204-94-214.sslip.io resolves to this
# host and carries a Let's Encrypt certificate (nginx vhost
# cli-proxy-tls-hostname), so it is trusted anywhere.
Environment="CPA_PUBLIC_BASE_URL=https://15-204-94-214.sslip.io"
# The service user has no home directory and PrivateTmp wipes /tmp on
# restart, so hosted images are cached inside the unit's own ReadWritePaths.
Environment="CPA_IMAGE_CACHE_DIR=/opt/cli-proxy/image-cache"
# This box has no domain of its own, so any link it hands out spells out the
# origin address. Images travel in the protocol's own image channel instead —
# an Anthropic image content block — which also dodges the markdown sanitiser
# that renders "[Image blocked]" for a data: URL written into the text.
# "base64" puts the data URL in the markdown, "link"/"relative" go back to
# hosted URLs.
Environment="CPA_IMAGE_DELIVERY=block"

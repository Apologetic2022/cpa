[Service]
# Generated image URLs must avoid the gateway self-signed TLS cert: the chat
# client renders them in a browser engine that will not trust it. Port 80 on the
# same host reaches the same gateway.
# Drop this override once the gateway serves a certificate the client trusts —
# without it the origin is taken from the inbound request (Host +
# X-Forwarded-Proto), which is what any other deployment should rely on.
Environment="CPA_PUBLIC_BASE_URL=http://15.204.94.214"

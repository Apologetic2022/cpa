# CLIProxyAPI — Mode-B relay gateway config (generated by deploy bundle)
# The gateway serves tenants on loopback only by default. Reach it over an SSH tunnel:
#   ssh -L 8317:127.0.0.1:8317 ubuntu@<server>
# Do NOT bind 0.0.0.0 without TLS + a strong api-keys entry.
host: "127.0.0.1"
port: 8317
tls:
  enable: false
  cert: ""
  key: ""
remote-management:
  allow-remote: false
  secret-key: "REPLACE_WITH_BCRYPT_HASH"
  disable-control-panel: false
  panel-github-repository: "https://github.com/router-for-me/Cli-Proxy-API-Management-Center"
auth-dir: "/opt/cli-proxy/auths"
api-keys:
  - "REPLACE_WITH_STRONG_API_KEY"
debug: false
logging-to-file: true
logs-max-total-size-mb: 256
usage-statistics-enabled: true

# Mode-B relay control plane (docs ch.6):
# this fork's Claude provider has NO direct Anthropic egress — turns are dispatched to
# the account's REAL Claude Code agent over a per-account Unix socket (docs 6.7.1:
# never TCP loopback on Linux). The uTLS transport and the credential refresh path are
# deleted from the fork (F3: the CC agent owns the OAuth token lifecycle).
relay:
  agents:
    # auth-ID -> agent endpoint (auth file name in auths/ is the ID)
    "claude-account.json": "unix:///run/relay/agent-claude-account.sock"
  store:                              # affinity + ban/quarantine authority (docs F8/F20, fail-closed)
    driver: "rqlite"                  # replicated Raft store, linearizable reads
    rqlite-url: "http://127.0.0.1:4001"
  turn-timeout-seconds: 900
  queue-depth: 8
  admission:
    coding-gate: "strict"
    allow-tools: true                 # docs 6.6.3: tolerate exact-name default CC toolset; custom schemas rejected
  limits:
    plan-cap-5h: 220000
    plan-cap-7d: 0
    opus-plan-cap-5h: 0
    quiet-hours: true
    default-timezone: "UTC"
    account-timezone: {}
